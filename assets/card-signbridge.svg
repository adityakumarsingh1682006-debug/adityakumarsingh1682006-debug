<svg xmlns="http://www.w3.org/2000/svg" width="500" height="292" viewBox="0 0 500 292" fill="none" role="img" aria-label="SIGNBRIDGE-AI project card">
<title>SIGNBRIDGE-AI project card</title>
<defs>
