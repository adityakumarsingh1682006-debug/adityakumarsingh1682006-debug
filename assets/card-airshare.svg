</text><rect x="97" y="196" width="64" height="24" rx="12" fill="#fff" fill-opacity=".07" stroke="#39FF88" stroke-opacity=".35"/><text x="129.0" y="212" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#E5FFF1" text-anchor="middle" >OpenCV</text><rect x="168" y="196" width="85" height="24" rx="12" fill="#fff" fill-opacity=".07" stroke="#39FF88" stroke-opacity=".35"/><text x="210.5" y="212" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#E5FFF1" text-anchor="middle" >MediaPipe</text><rect x="260" y="196" width="57" height="24" rx="12" fill="#fff" fill-opacity=".07" stroke="#39FF88" stroke-opacity=".35"/><text x="288.5" y="212" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="600" fill="#E5FFF1" text-anchor="middle" >Flask</text><rect x="26" y="238" width="152" height="34" rx="10" fill="#39FF88" fill-opacity=".10" stroke="#39FF88" stroke-opacity=".8"/><text x="44" y="260" font-family="'SF Pro Display','Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#65FFB0" text-anchor="start" >View Project</text><path d="M146 255H158M154 251L158 255L154 259" stroke="#39FF88" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="368" y="242" width="106" height="26" rx="13" fill="#39FF88" fill-opacity=".10" stroke="#39FF88" stroke-opacity=".5"/><circle cx="384" cy="255" r="3.4" fill="#39FF88"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle><text x="395" y="259" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" font-weight="600" fill="#65FFB0" text-anchor="start" letter-spacing="1.2" >ACTIVE</text>
