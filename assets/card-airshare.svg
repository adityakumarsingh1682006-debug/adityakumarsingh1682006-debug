<svg xmlns="http://www.w3.org/2000/svg" width="500" height="292" viewBox="0 0 500 292" fill="none" role="img" aria-label="AIRSHARE project card">
<title>AIRSHARE project card</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112a21"/><stop offset=".55" stop-color="#0d1f18"/><stop offset="1" stop-color="#0a1712"/></linearGradient>
<radialGradient id="bgGlow" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#39FF88" stop-opacity=".20"/><stop offset="1" stop-color="#39FF88" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CFFD4" stop-opacity=".8"/><stop offset=".5" stop-color="#39FF88" stop-opacity=".2"/><stop offset="1" stop-color="#00FFC6" stop-opacity=".6"/></linearGradient>
<linearGradient id="greenText" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#65FFB0"/><stop offset="1" stop-color="#39FF88"/></linearGradient>
