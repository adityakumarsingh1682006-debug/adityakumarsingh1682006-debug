name: Update profile analytics

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_analytics.py"
      - "scripts/svgkit.py"
      - ".github/workflows/update-analytics.yml"

permissions:
  contents: write

concurrency:
  group: update-analytics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate analytics SVGs
        env:
          GH_USER: adityakumarsingh1682006-debug
          # Optional: add a classic PAT (scope: read:user) as the secret GH_STATS_TOKEN
          # to include private-repo contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_analytics.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics.svg assets/activity.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile analytics [skip ci]"
            git push
          fi
